site_name: compressme
site_url: https://maclandrol.github.io/compressme/
site_description: Training-free model transformations, tested outputs and reproducible workflows.
repo_url: https://github.com/maclandrol/compressme
repo_name: maclandrol/compressme
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: false
strict: true
theme:
  name: material
  custom_dir: docs/overrides
  font: false
  language: en
  icon:
    logo: material/vector-combine
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
extra:
  generator: false
nav:
  - Start: index.md
  - Usage:
      - Installation: installation.md
      - Command line: cli.md
      - General workflow: general-workflow.md
      - ONNX Runtime comparison: onnx.md
      - Hugging Face: huggingface.md
  - Models:
      - Mol-JEPA: tutorials/moljepa.md
      - Boltz-2:
          - Reproduce: tutorials/boltz2.md
          - Results and limits: boltz2.md
      - STATE: state.md
      - Nesso-1:
          - Results and limits: nesso.md
          - Reproduce: tutorials/nesso.md
  - Evidence:
      - Technical report: technical-report.md
      - Model status: biology-targets.md
      - Optimization record: optimization-record.md
  - Methods:
      - Theory and prior art: theory.md
      - Shared frozen weights: sharing.md
      - Finite domains: finite-domains.md
      - Lossless file packing: packing.md
      - Lossless table storage: frozen-tables.md
      - Packed original embeddings: packed-embeddings.md
  - Backends:
      - GPU validation: gpu-validation.md
      - macOS: macos.md
      - Runtime: runtime.md
  - Build these docs: building-docs.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
plugins:
  - search
hooks:
  - tools/docs_hooks.py
extra_css:
  - assets/site.css
  - assets/katex/katex.min.css
extra_javascript:
  - assets/katex/katex.min.js
  - assets/katex/auto-render.min.js
  - assets/math.js
exclude_docs: |
  social-posts.md
  overrides/
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
